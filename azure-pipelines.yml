# Azure Pipelines Configuration for .NET

# This pipeline configuration uses .NET 6/7 and implements modern best practices.

trigger:
- main

pr:
- main

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '7.0.x' # Update to 6.0.x if using .NET 6

jobs:
- job: Build
  displayName: Build
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '$(dotnetVersion)'
      installationPath: $(Agent.ToolsDirectory)/dotnet

  - script: |
      dotnet restore
      dotnet build --configuration $(buildConfiguration)
    displayName: 'Restore and Build'

- job: Test
  displayName: Test
  dependsOn: Build
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - script: |
      dotnet test --configuration $(buildConfiguration) --no-restore
    displayName: 'Run Tests'

- job: Deploy
  displayName: Deploy
  dependsOn: Test
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - script: |
      echo "Deploying application..."
      # Validate deployment
      # Implementation of deployment steps here
    displayName: 'Deploy Application'

  - script: |
      # Verify successful deployment
      echo "Deployment Successful!"
    displayName: 'Validate Deployment'
